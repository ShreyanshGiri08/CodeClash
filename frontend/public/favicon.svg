<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141420" />
      <stop offset="60%" stop-color="#0a0a10" />
      <stop offset="100%" stop-color="#040407" />
    </radialGradient>

    <!-- Glowing Cyber Gold Gradient -->
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff033" />
      <stop offset="50%" stop-color="#ffe60c" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Electric Cyan Laser Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <!-- Ultra High Glow Filters -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Circle Frame -->
  <circle cx="256" cy="256" r="236" fill="url(#cyberBg)" stroke="url(#neonGold)" stroke-width="12" filter="url(#intenseGlow)" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.4" />

  <!-- Hexagonal Tech Grid Inner Shield -->
  <polygon points="256,48 420,142 420,332 256,426 92,332 92,142" fill="none" stroke="url(#electricCyan)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Dual Crossed Cyber Katana Blades '⚔️' (Laser Blades) -->
  <!-- Blade 1: Top-Left to Bottom-Right -->
  <path d="M 120 120 L 392 392" stroke="url(#electricCyan)" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 120 120 L 392 392" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Blade 2: Top-Right to Bottom-Left -->
  <path d="M 392 120 L 120 392" stroke="url(#electricCyan)" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 392 120 L 120 392" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Central Esports High-Voltage Lightning Bolt (Gold Clash Core) -->
  <path d="M 285 70 L 170 270 L 265 270 L 225 442 L 350 230 L 255 230 Z" fill="url(#neonGold)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" filter="url(#intenseGlow)" />

  <!-- Core Radiant Energy Star Spark -->
  <polygon points="256,220 264,248 292,256 264,264 256,292 248,264 220,256 248,248" fill="#ffffff" filter="url(#intenseGlow)" />
</svg>